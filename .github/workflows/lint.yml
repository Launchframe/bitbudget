# TEMPORARILY DISABLED (GHA budget): automatic runs off; manual via workflow_dispatch only.
# Re-enable pull_request + push on main when budget allows. Until then: pnpm lint via pre-commit hook.
# Branch protection may need required checks updated while this workflow is paused.
# Required for merge (when re-enabled): add "Lint" under Branch protection → status checks.
name: Lint

on:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
