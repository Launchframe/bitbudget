# TEMPORARILY DISABLED (GHA budget): automatic runs off; manual via workflow_dispatch only.
# Re-enable pull_request + push on main when budget allows. Until then: pnpm test / pnpm test:e2e locally
# and the pre-commit hook (eslint + vitest). Branch protection may need required checks updated.
# Required for merge (when re-enabled): add "Test" / "E2E" under Branch protection → status checks.
name: Test

on:
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: bitbudget_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bitbudget_e2e
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/bitbudget_e2e
      AUTH_SECRET: e2e-ci-auth-secret-at-least-32-characters-long-ok
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://127.0.0.1:3100
      NEXTAUTH_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      # Build is a separate step so PR logs show full `next build` output when it fails.
      PW_WEBSERVER_SKIP_BUILD: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm exec next build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: pnpm test:e2e
