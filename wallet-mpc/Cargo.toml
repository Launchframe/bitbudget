[package]
name = "wallet-mpc"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bitcoin = "=0.32.8"
frost-secp256k1-tr = "=3.0.0"
getrandom = { version = "=0.2.17", features = ["js"], optional = true }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
thiserror = "=2.0.18"
wasm-bindgen = { version = "=0.2.114", optional = true }
zeroize = "=1.8.2"

[dev-dependencies]
hex = "=0.4.3"
secp256k1 = "=0.31.1"
serde_json = "=1.0.149"

[features]
wasm = ["dep:wasm-bindgen", "dep:getrandom"]
